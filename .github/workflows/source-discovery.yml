name: Radar source discovery
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/source-intake.js'
      - 'scripts/triage-candidates.js'
      - 'scripts/update-lead-history.js'
      - 'scripts/write-run-summary.js'
      - 'tests/lead-history.test.js'
      - 'scripts/inspect-lead-pages.js'
      - '.github/workflows/source-discovery.yml'
  pull_request:
    paths:
      - 'scripts/source-intake.js'
      - 'scripts/triage-candidates.js'
      - 'scripts/update-lead-history.js'
      - 'scripts/write-run-summary.js'
      - 'tests/lead-history.test.js'
      - '.github/workflows/source-discovery.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: radar-source-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test persistent lead history
        run: node --test tests/lead-history.test.js
      - name: Inspect monitored source websites
        run: node scripts/source-intake.js
      - name: Compare extracted titles against catalog entries
        run: node scripts/triage-candidates.js
      - name: Inspect individual lead pages for evidence
        run: node scripts/inspect-lead-pages.js
      - name: Build editorial review queue
        run: node scripts/build-editorial-review.js
      - name: Restore public lead history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json?ref=radar-state" --jq .content | base64 --decode > intake/lead-history-previous.json
      - name: Compare against persistent public lead history
        run: node scripts/update-lead-history.js
      - name: Save public lead history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json?ref=radar-state" --jq .sha)
          payload=$(base64 -w 0 intake/lead-history-next.json)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json" -f branch=radar-state -f message="Update public lead history from run ${GITHUB_RUN_ID}" -f content="$payload" -f sha="$sha" --silent
      - name: Publish run summary in GitHub Actions
        run: node scripts/write-run-summary.js
      - uses: actions/upload-artifact@v4
        with:
          name: source-intake-${{ github.run_id }}
          path: |
            intake/source-review.json
            intake/candidate-triage.json
            intake/lead-evidence.json
            intake/editorial-review.json
            intake/lead-history-delta.json
            intake/run-summary.md
          if-no-files-found: error
      - name: Link report in daily editorial queue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=America/Bahia date +%F)
          title="Radar editorial: $day"
          issue=$(gh issue list --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Relatório de fontes disponível como artefato desta execução: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Leads não foram verificados editorialmente nem publicados."
          fi
